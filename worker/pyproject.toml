# Worker project + tooling config. The worker is the one Python boundary in foray;
# the Go control plane is configured separately (.golangci.yml, Makefile).
#
# Managed with uv. This file is the single source of truth for the worker's
# dependencies — there are no requirements*.txt files — and uv.lock beside it pins
# the resolution so CI, the image, and a laptop install the same thing.
#
#   uv sync --project worker                 # base + dev (what CI does)
#   uv sync --project worker --extra gpu     # add the GPU stack (needs a GPU box)
#   uv run  --project worker python -m pytest worker/tests
#
# Run uv from the repo root (with --project worker, as above) rather than from
# worker/: the package imports as `worker.*`, so the repo root has to be the
# working directory. `[tool.uv] package = false` keeps uv out of the business of
# building/installing the tree, which is what makes that layout work.

[project]
name = "foray-worker"
version = "0.0.0"
description = "foray nnsight worker — the one Python boundary (ARCHITECTURE.md §6.7)"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

# Base deps: the light, GPU-free, AWS-free set. This is all CI installs, and all
# the FORAY_FAKE=1 path and the unit tests need.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "boto3>=1.35",
]

[project.optional-dependencies]
# The GPU stack — NOT installed in CI (there is no GPU there). It goes into the
# worker image and onto the manual smoke instance only. worker/engine.py,
# worker/loader.py and worker/saves.py import these lazily inside the real paths,
# so the base path never needs them.
gpu = [
    "torch>=2.5",
    "nnsight>=0.4",
    "vllm>=0.6",
    "transformers>=4.46",
    "safetensors>=0.4",
    # GPUDirect Storage fast path (S3 -> HBM). Optional at runtime: loader.py falls
    # back to a plain download when kvikio/cuFile isn't present.
    "kvikio-cu12>=24.10",
]

[dependency-groups]
# Test + lint. A dependency-group rather than an extra: these are for developing
# the worker, never for running it, so the image never installs them.
dev = [
    "pytest>=8.3",
    "httpx>=0.27", # FastAPI TestClient transport
    "ruff>=0.7",
]

[tool.uv]
# Not an installable package — uv manages the environment, and `worker.*` is
# imported from the repo root. See the header note.
package = false

[tool.pytest.ini_options]
# Tests run from the repo root so `worker.*` resolves; testpaths keeps discovery
# to this tree.
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# PLC0415 (import-outside-top-level) is intentionally allowed: heavy deps
# (torch/nnsight/vllm/boto3) are imported lazily inside real paths so the fake
# path and CI need none of them. That is a design rule, not a smell.
select = ["E", "F", "I", "PL"]
ignore = ["PLC0415"]

[tool.ruff.lint.per-file-ignores]
# Tests assert on literal HTTP status codes (200/400) — that's clearer than
# hoisting them to named constants, so the magic-value rule is noise here.
"tests/*" = ["PLR2004"]
